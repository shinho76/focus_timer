name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r dist _site/dist
          # demo/index.html loads the bundle via "../dist/focus-timer.js" (correct
          # when served from demo/ next to a sibling dist/, e.g. local http-server).
          # The published site serves index.html from the site root instead, with
          # dist/ as its own sibling, so the relative path is one level shallower.
          sed 's#\.\./dist/#dist/#' demo/index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
